name: Release

# Publish a signed APK whenever a version tag is pushed (v1.4.3, ...).
# Can also be triggered by hand from the Actions tab (supply the tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.4.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
    steps:
      - name: Check signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_ALIAS repository secrets." >&2
            exit 1
          fi

      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG#v}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck & unit tests
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx eslint src
          npm test

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Restore signing keystore from secrets
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/keystore/release.keystore" \
            "$KEYSTORE_PASSWORD" \
            "$KEYSTORE_ALIAS" \
            "$KEYSTORE_PASSWORD" > android/keystore.properties

      # The repository does not ship preset songs (they live in the
      # EndfieldSongs-v1.0.zip release asset), so CI always builds the lite APK.
      - name: Build web assets
        run: npx vite build --config vite.capacitor.config.ts

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionName=${{ steps.ver.outputs.version }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/EndfieldMusicTerminal-${{ steps.ver.outputs.tag }}.apk"
          ls -l out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading the APK (overwrite)."
            gh release upload "$TAG" out/*.apk --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" out/*.apk --title "$TAG" --generate-notes
          fi
