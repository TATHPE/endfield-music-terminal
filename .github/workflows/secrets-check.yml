name: Secrets check

# 仅用于排查签名 secrets 是否对该仓库的 workflow 可见。
# 只打印"是否存在 + 长度"，**绝不打印任何密文内容**。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
    steps:
      - name: Report secret visibility (lengths only)
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEYSTORE_ALIAS; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "MISSING  $name"
            else
              echo "OK       $name  length=${#value}"
            fi
          done
          echo "---"
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF ref_type=$GITHUB_REF_TYPE"
          if [ "$KEYSTORE_ALIAS" = "endfield" ]; then
            echo "alias  = endfield (与 keystore 一致)"
          elif [ -z "$KEYSTORE_ALIAS" ]; then
            echo "alias  = (缺失)"
          else
            echo "alias  = 与 endfield 不一致（长度 ${#KEYSTORE_ALIAS}）"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            case "$KEYSTORE_BASE64" in
              *[!A-Za-z0-9+/=]*) echo "base64 里含非 base64 字符（可能粘进了换行/引号）" ;;
            esac
          fi
