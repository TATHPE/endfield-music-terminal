name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck & unit tests
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx eslint src
          npm test

      # Runs without the Android SDK (AGP's own unit-test task cannot load the
      # test classes on Windows paths with non-ASCII characters).
      - name: Java unit tests (lyrics parsing)
        run: |
          mkdir -p /tmp/jt/classes
          curl -sSL -o /tmp/jt/junit.jar    https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o /tmp/jt/hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl -sSL -o /tmp/jt/json.jar     https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          javac -encoding UTF-8 -cp /tmp/jt/json.jar:/tmp/jt/junit.jar -d /tmp/jt/classes \
            android/app/src/main/java/com/endfield/audio/terminal/lyrics/LyricsParsing.java \
            android/app/src/test/java/com/endfield/audio/terminal/lyrics/LyricsParsingTest.java
          java -cp "/tmp/jt/classes:/tmp/jt/json.jar:/tmp/jt/junit.jar:/tmp/jt/hamcrest.jar" \
            org.junit.runner.JUnitCore com.endfield.audio.terminal.lyrics.LyricsParsingTest

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Build web assets (APK build config)
        run: npx vite build --config vite.capacitor.config.ts

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
    steps:
      - name: Check signing secrets
        id: check
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret configured; release build skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Lint, typecheck & unit tests
        if: steps.check.outputs.skip != 'true'
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx eslint src
          npm test

      - name: Java unit tests (lyrics parsing)
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/jt/classes
          curl -sSL -o /tmp/jt/junit.jar    https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o /tmp/jt/hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl -sSL -o /tmp/jt/json.jar     https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          javac -encoding UTF-8 -cp /tmp/jt/json.jar:/tmp/jt/junit.jar -d /tmp/jt/classes \
            android/app/src/main/java/com/endfield/audio/terminal/lyrics/LyricsParsing.java \
            android/app/src/test/java/com/endfield/audio/terminal/lyrics/LyricsParsingTest.java
          java -cp "/tmp/jt/classes:/tmp/jt/json.jar:/tmp/jt/junit.jar:/tmp/jt/hamcrest.jar" \
            org.junit.runner.JUnitCore com.endfield.audio.terminal.lyrics.LyricsParsingTest

      - name: Setup JDK 21
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Restore signing keystore from secrets
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/keystore/release.keystore" \
            "$KEYSTORE_PASSWORD" \
            "$KEYSTORE_ALIAS" \
            "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Build web assets (APK build config)
        if: steps.check.outputs.skip != 'true'
        run: npx vite build --config vite.capacitor.config.ts

      - name: Sync Capacitor
        if: steps.check.outputs.skip != 'true'
        run: npx cap sync android

      - name: Build release APK
        if: steps.check.outputs.skip != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload release APK
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
