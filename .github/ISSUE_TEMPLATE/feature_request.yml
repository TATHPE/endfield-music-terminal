name: 功能建议 / Feature request
description: 想要的新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 想解决什么问题？期望的表现是什么样的？
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、其它播放器的做法、参考资料等
    validations:
      required: false
